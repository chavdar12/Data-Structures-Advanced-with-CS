name: Build and test

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Data-Structures-Advanced.slnx
      - run: dotnet build Data-Structures-Advanced.slnx --no-restore -c Release
      - run: dotnet test Data-Structures-Advanced.slnx --no-build -c Release
